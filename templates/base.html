<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Garten-Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-inner page-wrap">
            <a href="/" class="header-brand">
                <h1>🌱 Garten-Tracker</h1>
                <p class="subtitle">Mein persönlicher Gartenkalender</p>
            </a>
            <nav class="header-nav">
                <a href="/beobachtungen" class="nav-link{% if request.path == '/beobachtungen' %} nav-active{% endif %}">🔍 Beobachtungen</a>
                <a href="/ereignisse" class="nav-link{% if request.path == '/ereignisse' %} nav-active{% endif %}">🗓️ Ereignisse</a>
                <a href="/phaenologie" class="nav-link{% if request.path.startswith('/phaenologie') %} nav-active{% endif %}">🍃 Phänologie</a>
            </nav>
        </div>
    </header>
    <div class="page-wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
