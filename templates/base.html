<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Garten-Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="page-wrap" style="padding-top:0;padding-bottom:0;display:flex;justify-content:space-between;align-items:center">
            <a href="/" style="color:var(--white);text-decoration:none">
                <h1>🌱 Garten-Tracker</h1>
                <p class="subtitle">Mein persönlicher Gartenkalender</p>
            </a>
            <nav>
                <a href="/beobachtungen" style="color:var(--white);text-decoration:none;font-size:.85rem;opacity:.8">🔍 Beobachtungen</a>
                <a href="/ereignisse" style="color:var(--white);text-decoration:none;font-size:.85rem;opacity:.8">🗓️ Ereignisse</a>
                <a href="/phaenologie" style="color:var(--white);text-decoration:none;font-size:.85rem;opacity:.8">🍃 Phänologie</a>
            </nav>
        </div>
    </header>
    <div class="page-wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
